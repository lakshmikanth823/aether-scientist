version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - models:/models
    environment:
      - HF_HOME=/models
    entrypoint: ["uvicorn", "aether_scientist.api.endpoints:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  models:
