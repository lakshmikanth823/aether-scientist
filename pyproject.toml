[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-scientist"
version = "1.6.4"

description = "Domain-specialized scientific research LLM with RAG, citation grounding, and streaming"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AetherScientist Contributors"}]
keywords = ["llm", "scientific", "rag", "research", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.23",
    "Pillow>=10.0",
    "typer[all]>=0.9",
    "numpy>=1.24",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30",
]
vision = [
    "Pillow>=10.0",
    "transformers>=4.30",
]

finetune = [
    "peft>=0.7",
    "trl>=0.8",
    "datasets>=2.14",
    "bitsandbytes>=0.41",
]
rag = [
    "pymupdf>=1.22",
    "sentence-transformers>=2.2",
]
web = [
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.5",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "httpx>=0.24",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/aetherscientist/aether-scientist"
Repository = "https://github.com/aetherscientist/aether-scientist"
Issues = "https://github.com/aetherscientist/aether-scientist/issues"

[project.scripts]
aether = "aether_scientist.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether_scientist*", "ui*"]


[tool.setuptools.package-data]
aether_scientist = ["benchmarks/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
