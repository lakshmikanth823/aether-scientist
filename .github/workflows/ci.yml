name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . --line-length 100
      - name: Type Check
        run: mypy aether_scientist/core/ aether_scientist/domains/ aether_scientist/utils/
      - name: Test
        run: pytest tests/ --cov=aether_scientist --cov-fail-under=90
      - name: Line Count Check
        run: |
          python -c "
          import pathlib
          limits = {'model.py': 300, 'config.py': 50, 'tokenizer.py': 150}
          for p in pathlib.Path('aether_scientist').rglob('*.py'):
              lines = len(p.read_text().splitlines())
              limit = limits.get(p.name, 500)
              assert lines <= limit, f'{p}: {lines} lines exceeds {limit}'
          print('All files within line limits')
          "
